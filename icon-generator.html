<!-- Icon Generator - Open this file in browser to generate icons -->
<!DOCTYPE html>
<html>
<head>
    <title>No Pass Icon Generator</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        canvas {
            border: 1px solid #333;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            background: #00ffff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>No Pass Icon Generator</h1>
    <p>Right-click each canvas and "Save Image As" to save the icons</p>
    
    <h2>128x128 (Store)</h2>
    <canvas id="canvas128" width="128" height="128"></canvas>
    
    <h2>48x48 (Toolbar)</h2>
    <canvas id="canvas48" width="48" height="48"></canvas>
    
    <h2>32x32</h2>
    <canvas id="canvas32" width="32" height="32"></canvas>
    
    <h2>16x16</h2>
    <canvas id="canvas16" width="16" height="16"></canvas>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const radius = size * 0.4;
            
            // Clear
            ctx.clearRect(0, 0, size, size);
            
            // Background - dark with subtle gradient
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, size/2);
            gradient.addColorStop(0, '#0f0f1a');
            gradient.addColorStop(1, '#1a0a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Outer glow - neon red
            ctx.shadowColor = '#ff0040';
            ctx.shadowBlur = size * 0.15;
            
            // Draw octagon border
            ctx.beginPath();
            const octagonRadius = radius * 0.9;
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI / 4) - Math.PI / 8;
                const x = center + octagonRadius * Math.cos(angle);
                const y = center + octagonRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = '#ff0040';
            ctx.lineWidth = Math.max(2, size * 0.06);
            ctx.stroke();
            
            // Inner fill with glow
            ctx.shadowBlur = size * 0.1;
            ctx.fillStyle = 'rgba(255, 0, 64, 0.15)';
            ctx.fill();
            
            // Draw X mark
            ctx.shadowColor = '#ff0040';
            ctx.shadowBlur = size * 0.1;
            ctx.strokeStyle = '#ff0040';
            ctx.lineWidth = Math.max(2, size * 0.08);
            ctx.lineCap = 'round';
            
            const xSize = radius * 0.5;
            ctx.beginPath();
            ctx.moveTo(center - xSize, center - xSize);
            ctx.lineTo(center + xSize, center + xSize);
            ctx.moveTo(center + xSize, center - xSize);
            ctx.lineTo(center - xSize, center + xSize);
            ctx.stroke();
            
            // Add bright center glow
            const glow = ctx.createRadialGradient(center, center, 0, center, center, radius * 0.5);
            glow.addColorStop(0, 'rgba(255, 0, 64, 0.3)');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, size, size);
        }
        
        // Draw all icons
        drawIcon(document.getElementById('canvas16'), 16);
        drawIcon(document.getElementById('canvas32'), 32);
        drawIcon(document.getElementById('canvas48'), 48);
        drawIcon(document.getElementById('canvas128'), 128);
        
        // Add download links
        setTimeout(() => {
            const sizes = [16, 32, 48, 128];
            sizes.forEach(size => {
                const canvas = document.getElementById('canvas' + size);
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'icon' + size + '.png';
                link.textContent = 'Download ' + size + 'x' + size;
                link.style.display = 'block';
                link.style.color = '#00ffff';
                link.style.margin = '10px';
                document.body.appendChild(link);
            });
        }, 100);
    </script>
</body>
</html>
